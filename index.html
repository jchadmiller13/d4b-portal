<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFD District 4-B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout idea: a dark command bar with a red apparatus stripe, a scrolling tab rail, then dense scan-first panels on a quiet grey field. */
:root{
  --bg:#eff1f4; --surface:#ffffff; --ink:#15181e; --muted:#5b6370; --line:#dde1e7; --soft:#f6f7f9;
  --accent:#b3261e; --accent-ink:#ffffff; --brass:#a87418;
  --bar:#1a1d24; --bar-ink:#f2f3f5; --bar-muted:#a3a9b4;
  --ok:#1d7148; --ok-bg:#e2f2e9; --warn:#8f5b00; --warn-bg:#fbefd4; --crit:#b3261e; --crit-bg:#fbe4e2; --info:#2b5a9a; --info-bg:#e3ecf8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --surface:#1a1d23; --ink:#e7e9ed; --muted:#9aa1ac; --line:#2b2f37; --soft:#20242b;
    --accent:#d9473c; --accent-ink:#ffffff; --brass:#d3a24a;
    --bar:#0b0c0f; --bar-ink:#eef0f3; --bar-muted:#8e95a1;
    --ok:#5cc28f; --ok-bg:#16301f; --warn:#e0aa48; --warn-bg:#352a12; --crit:#f07a70; --crit-bg:#3a1917; --info:#86aee6; --info-bg:#182638;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d23; --ink:#e7e9ed; --muted:#9aa1ac; --line:#2b2f37; --soft:#20242b;
  --accent:#d9473c; --accent-ink:#ffffff; --brass:#d3a24a;
  --bar:#0b0c0f; --bar-ink:#eef0f3; --bar-muted:#8e95a1;
  --ok:#5cc28f; --ok-bg:#16301f; --warn:#e0aa48; --warn-bg:#352a12; --crit:#f07a70; --crit-bg:#3a1917; --info:#86aee6; --info-bg:#182638;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* command bar */
.bar{background:var(--bar);color:var(--bar-ink);border-bottom:4px solid var(--accent)}
.bar-in{max-width:1240px;margin:0 auto;padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.bar-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.bar h1{font-size:28px;text-transform:uppercase}
.bar .meta{color:var(--bar-muted);font-size:14px}
.bar .meta b{color:var(--bar-ink);font-weight:600}
.shiftchip{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;padding:0 8px;border-radius:3px;margin-left:4px;letter-spacing:.04em}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--bar-muted);text-decoration:none;font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 10px;white-space:nowrap;border-bottom:3px solid transparent}
nav a:hover{color:var(--bar-ink)}
nav a.on{color:var(--bar-ink);border-bottom-color:var(--brass)}

main{max-width:1240px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:6px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.crit{background:var(--crit-bg);color:var(--crit)}

.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.linkbtn{background:none;border:0;padding:0;color:var(--info);cursor:pointer;text-decoration:underline;font-size:inherit}
body.ro .w{display:none!important}
body.locked nav,body.locked #bmeta{display:none}
.login{max-width:440px;margin:24px auto;width:100%}
#who button{background:none;border:1px solid var(--bar-muted);color:var(--bar-ink);border-radius:4px;padding:1px 8px;margin-left:6px;cursor:pointer;font-size:13px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel .ph a{font-size:13px;color:var(--info)}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px 14px}
.tile.ok{border-left-color:var(--ok)}.tile.warn{border-left-color:var(--warn)}.tile.crit{border-left-color:var(--crit)}.tile.info{border-left-color:var(--info)}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.05}
.tile .s{font-size:13px;color:var(--muted)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--info-bg);color:var(--info)}
.sh{display:inline-block;min-width:20px;text-align:center;font-family:var(--display);font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:13px}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.li .d{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.out td{color:var(--muted)}
tr.out td:first-child{text-decoration:line-through}

/* station staffing meters */
.st{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st .row.lead{justify-content:flex-start}
.stgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.stgrid .st{border-top:0;padding:0;gap:2px}
.stgrid .crew{margin-top:2px;padding:4px}
/* collapsible company boxes (Daily Staffing) */
details.co{display:block}
details.co summary{cursor:pointer;list-style:none}
details.co summary::-webkit-details-marker{display:none}
details.co summary h3::before{content:"▸ ";color:var(--muted)}
details.co[open] summary h3::before{content:"▾ "}
details.co[open] summary{margin-bottom:10px}
.crew{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:14px;line-height:1.4;white-space:nowrap}
.mem small{color:var(--muted)}
.mem.r3{background:#b3261e;color:#fff}
.mem.r2{background:#1d7148;color:#fff}
.mem.r5{background:#f2c200;color:#111;border-color:#c99f00}
.mem.r5 small{color:#3a3000}
.mem.r1{background:#111;color:#fff;border-color:#444}
.mem.r3 small,.mem.r2 small,.mem.r1 small{color:rgba(255,255,255,.85)}
/* paramedics (EMS licensure = Paramedic on the Roster): name letters in bright blue */
.mem.medic b{color:#1e90ff}
.mem.in{border-color:var(--info)}
.mem[data-drag]{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mem.mv{outline:2px dashed var(--brass);outline-offset:1px}
.st.dropok{background:color-mix(in srgb,var(--brass) 18%,transparent);border-radius:6px}
.ghost{position:fixed;z-index:40;pointer-events:none;opacity:.9;transform:translate(-50%,-120%);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.mem.lifted{opacity:.35}
.mem.r5.in,.mem.r5.alt,.mem.r3.in,.mem.r2.in,.mem.r1.in,.mem.r3.alt,.mem.r2.alt,.mem.r1.alt{border-width:3px}
.mem.alt{border-color:var(--brass)}
.rt{font-weight:600}
.rt.r5{color:color-mix(in srgb,#f2c200 55%,var(--ink))}
.rt.r3{color:var(--crit)}
.rt.r2{color:var(--ok)}
.rt.r1{color:var(--ink)}
.meter{position:relative;height:10px;background:var(--soft);border-radius:5px;overflow:visible}
.meter .f{height:100%;border-radius:5px;background:var(--ok)}
.meter .f.crit{background:var(--crit)}
.meter .min{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* vacation year */
.year{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mon{border:1px solid var(--line);border-radius:6px;padding:8px 10px 10px;background:var(--surface)}
.mon h3{font-size:15px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.day{aspect-ratio:1/1;border:1px solid transparent;border-radius:3px;background:var(--soft);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1.05;position:relative}
.day small{font-size:8px;color:var(--muted);font-family:var(--display);font-weight:700}
.day.l1{background:color-mix(in srgb,var(--info) 22%,var(--surface))}
.day.l2{background:color-mix(in srgb,var(--info) 45%,var(--surface))}
.day.l3{background:color-mix(in srgb,var(--info) 70%,var(--surface));color:#fff}
.day.l3 small{color:#fff}
.day.over{border-color:var(--crit);border-width:2px}
.day.req::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--brass)}
.day.off{opacity:.28}
.day.blank{background:transparent;cursor:default}
.day.today{outline:2px solid var(--ink);outline-offset:-1px}
.day.sel{outline:2px solid var(--brass);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--accent)}
.modal.wide{max-width:900px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:7px 9px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.mf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.err{color:var(--crit);font-size:13px}
.fhead{grid-column:1/-1;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px;border-bottom:1px solid var(--line);padding-top:6px;color:var(--ink)}
.fhead.lock{color:var(--brass)}
.cell2{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
select.inline{width:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:6px;font-size:14px;z-index:30;max-width:90vw}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:var(--surface)}
.hint{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="locked">
<header class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <h1 id="bname">TFD District 4-B</h1>
      <div class="meta" id="bmeta"></div>
      <div class="meta" id="who"></div>
    </div>
    <nav id="nav">
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#staffing" data-v="staffing">Daily Staffing</a>
      <a href="#vacation" data-v="vacation">Vacation</a>
      <a href="#training" data-v="training">Training</a>
      <a href="#assignments" data-v="assignments">Special Assignments</a>
      <a href="#reports" data-v="reports">Reports</a>
      <a href="#requirements" data-v="requirements">Member Requirements</a>
      <a href="#roster" data-v="roster">Roster</a>
      <a href="#setup" data-v="setup">Setup</a>
    </nav>
  </div>
</header>
<main id="main"></main>
<div id="modalRoot"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const dnum = s => { const [y,m,d] = String(s).split("-").map(Number); return Date.UTC(y, m-1, d) / 864e5; };
const fromNum = n => { const t = new Date(n * 864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; };
const addDays = (s, n) => fromNum(dnum(s) + n);
const addMonths = (s, n) => { const [y,m,d] = s.split("-").map(Number); const t = new Date(Date.UTC(y, m-1+n, 1)); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate(); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(Math.min(d,last))}`; };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||""));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt = s => { if (!isDate(s)) return esc(s||""); const [y,m,d] = s.split("-").map(Number); return `${MON[m-1]} ${d}, ${y}`; };
const fmtShort = s => { if (!isDate(s)) return esc(s||""); const [,m,d] = s.split("-").map(Number); return `${MON[m-1]} ${d}`; };
const dowOf = s => DOW[new Date(dnum(s)*864e5).getUTCDay()];
const range = (a, b) => !b || b === a ? fmt(a) : `${fmtShort(a)} – ${fmt(b)}`;

/* ---------- state ---------- */
const COLLS = ["personnel","staffing","vacations","training","assignments","reports","cancels"];
const state = { settings:null, vacbook:null, priv:[], personnel:[], staffing:[], vacations:[], training:[], assignments:[], reports:[], cancels:[] };
let db = null, canWrite = true, isAdmin = false, reqCo = "All", loaded = new Set(), loadNote = "", view = "dashboard";
let staffDate = today(), vacYear = Number(today().slice(0,4)), vacSel = today(), vacFilter = "Pending", trainFilter = "Upcoming", asgFilter = "Active", rosterQ = "", rosterShift = "All";

const DEFAULTS = { battalion:"TFD District 4-B", shifts:["A","B","C"], shiftAnchor: today(), stations:[], maxOff:3, homeShift:"", kelly:null, reqMonths:{ physical:12, pat:12, hazmat:12, refresher:12 } };
const S = () => { const o = { ...DEFAULTS, ...(state.settings || {}) }; o.reqMonths = { ...DEFAULTS.reqMonths, ...(o.reqMonths||{}) }; return o; };
const shifts = () => S().shifts.length ? S().shifts : ["A","B","C"];
const stationNames = () => S().stations.map(s => s.name);
const lastOf = p => (p.last || String(p.name||"").trim().split(/\s+/).pop() || "").trim();
const names = () => state.personnel.filter(p => p.name).sort((a,b) => lastOf(a).localeCompare(lastOf(b), undefined, {sensitivity:"base"}) || a.name.localeCompare(b.name)).map(p => p.name);
const person = n => state.personnel.find(p => p.name === n);
function shiftOn(d){
  const sh = shifts(), a = S().shiftAnchor;
  if (!isDate(a) || !isDate(d)) return sh[0];
  const k = (((dnum(d) - dnum(a)) % sh.length) + sh.length) % sh.length;
  return sh[k];
}

/* Kelly day: on the anchor's shift, C/S groups take turns being off, one group per shift worked */
function kellyGroup(d){
  const k = S().kelly; if (!k || !isDate(k.anchor) || !isDate(d) || !(+k.groups)) return null;
  const n = shifts().length, diff = dnum(d) - dnum(k.anchor);
  if (((diff % n) + n) % n) return null;
  const g = +k.groups, idx = diff / n;
  return ((((+k.start||1) - 1 + idx) % g) + g) % g + 1;
}
/* the next day the district works (today if it's on duty) */
function homeDate(){
  const h = S().homeShift, t = today(); if (!h) return t;
  for (let i = 0; i < 10; i++){ const d = addDays(t, i); if (shiftOn(d) === h) return d; }
  return t;
}
const stepDays = () => S().homeShift ? shifts().length : 1;
/* +1 adds someone to the day's roster, -1 takes them off */
const KINDS = { "Temporary move":0, "Overtime":1, "Detail in":1, "Trade in":1, "Sick":-1, "Injury":-1, "Detail out":-1, "Trade out":-1, "Other leave":-1 };

function staffFor(d){
  const sh = shiftOn(d);
  const off = new Map(), kg = kellyGroup(d);
  if (kg) state.personnel.filter(p => p.shift === sh && String(p.csGroup) === String(kg)).forEach(p => off.set(p.name, { why:"City Shift Group off", src:"kelly" }));
  const lo = leaveOrder(d), altOf = new Map();
  lo.alt.forEach((v,i) => altOf.set(v.name, i+1));
  lo.off.concat(lo.extra, lo.flex, lo.other).forEach(v => off.set(v.name, { why: v.type || "Vacation", src:"vac" }));
  const ex = state.staffing.filter(x => x.date === d);
  ex.filter(x => KINDS[x.kind] < 0).forEach(x => off.set(x.name, { why: x.kind, src:"ex", id:x.id }));
  const rows = [];
  const moves = new Map(ex.filter(x => x.kind === "Temporary move" && x.station).map(x => [x.name, x]));
  state.personnel.filter(p => p.shift === sh).forEach(p => {
    const o = off.get(p.name), mv = moves.get(p.name);
    rows.push({ name:p.name, rank:p.rank, station: mv ? mv.station : p.station, unit: mv ? (mv.unit || unitOf(mv.station)) : p.unit, position:p.position, moved: mv ? p.station : null, mvId: mv && mv.id, status:o ? o.why : altOf.has(p.name) ? `Alternate ${altOf.get(p.name)}` : "On duty", on:!o, alt:altOf.has(p.name) && !o, exId:o && o.id });
  });
  ex.filter(x => KINDS[x.kind] > 0).forEach(x => {
    const p = person(x.name) || {};
    rows.push({ name:x.name, rank:p.rank||"", station:x.station||p.station, unit:x.unit||p.unit, position:x.position||p.position||"", status:x.kind, on:true, inbound:true, exId:x.id });
  });
  const st = S().stations.map(s => { const r = rows.filter(x => x.station === s.name); return { ...s, rows:r, on:r.filter(x=>x.on).length }; });
  const stray = rows.filter(r => !stationNames().includes(r.station));
  if (stray.length) st.push({ name:"No company set", min:0, rows:stray, on:stray.filter(x=>x.on).length });
  const order = { "FD-05":0, "FD-04":1, "FD-03":2, "FD-02":3, "FD-01":4 };
  st.forEach(s => s.rows.sort((a,b) => (a.unit||"").localeCompare(b.unit||"") || (order[a.rank]??9)-(order[b.rank]??9)));
  return { shift:sh, kg, rows, stations:st, onDuty:rows.filter(r=>r.on).length, minTotal:S().stations.reduce((a,s)=>a+(+s.min||0),0) };
}

/* Approved leave on a day, in vacation-book order: the first maxOff are off, the rest are alternates */
function leaveOrder(d){
  const sh = shiftOn(d), book = ((state.vacbook || {}).days || {})[d] || [];
  const cover = v => v.start <= d && (v.end || v.start) >= d && ((v.shift || (person(v.name)||{}).shift || sh) === sh);
  const rank = v => { const i = book.indexOf(v.name); return i >= 0 ? i : 1e4 + (+v.added || 0) / 1e13; };
  const seen = new Set(), list = [];
  state.vacations.filter(v => v.status === "Approved" && cover(v)).sort((a,b) => rank(a) - rank(b)).forEach(v => { if (!seen.has(v.name)){ seen.add(v.name); list.push(v); } });
  /* outside the daily slots: the member is always exempt, or this leave was scheduled in another district */
  const exempt = v => v.outsideSlots === "Yes" || (person(v.name) || {}).slotExempt === "Yes";
  /* approved City Shift Group flex: off the line-up, but not in a vacation slot */
  const isFlex = v => v.type === "City Shift Group flex";
  /* Admin Duty and Authorized Leave: off their company, listed under Other changes, never in a vacation slot */
  const isOther = v => NON_SLOT.includes(v.type);
  const flex = list.filter(isFlex), other = list.filter(isOther), rest = list.filter(v => !isFlex(v) && !isOther(v));
  const extra = rest.filter(exempt), slotted = rest.filter(v => !exempt(v));
  const max = +S().maxOff || slotted.length;
  return { off: slotted.slice(0, max), extra, flex, other, alt: slotted.slice(max), req: state.vacations.filter(v => v.status === "Requested" && cover(v)) };
}
const NON_SLOT = ["Admin Duty","Authorized Leave"];
function offCount(d){ const o = leaveOrder(d); return { appr:o.off, extra:o.extra, flex:o.flex, other:o.other, alt:o.alt, req:o.req }; }

function repState(r){
  if (r.frequency === "One-time" && r.status === "Submitted") return ["Submitted","ok"];
  const t = today();
  if (!isDate(r.due)) return ["No due date",""];
  if (r.due < t) return ["Overdue","crit"];
  if (dnum(r.due) - dnum(t) <= 7) return ["Due soon","warn"];
  return ["On track","ok"];
}
function asgState(a){
  const t = today();
  if (a.start && a.start > t) return ["Upcoming","info"];
  if (a.end && a.end < t) return ["Ended",""];
  return ["Active","ok"];
}

async function saveForm(){
  const { coll, id } = modalCtx, spec = F[coll];
  const prev = id ? state[coll].find(x => x.id === id) : null;
  const data = prev ? { ...prev } : {}; delete data.id;
  for (const [k,label,type,o={}] of spec.fields){
    if (type === "head") continue;
    let v = $("#f_"+k).value.trim();
    if (type === "number") v = v === "" ? "" : Number(v);
    if (o.req && v === "") { $("#ferr").textContent = `${label} is required.`; return; }
    data[k] = v;
  }
  if (modalCtx.extraKeys.length){ data.extra = {}; modalCtx.extraKeys.forEach((k,i) => data.extra[k] = $("#x_"+i).value); }
  if (data.end && data.start && data.end < data.start){ $("#ferr").textContent = "The end date is before the start date."; return; }
  if (coll === "vacations"){ data.shift = (person(data.name)||{}).shift || S().homeShift || ""; if (!data.added) data.added = Date.now(); }
  try {
    if (!db) throw new Error("offline");
    const ref = id ? db.collection(coll).doc(id) : db.collection(coll).doc();
    await ref.set(data);
    if (modalCtx && modalCtx.priv){
      const pv = { name: data.name }; PRIV_FIELDS.forEach(([k]) => { const v = $("#p_"+k).value.trim(); if (v) pv[k] = v; });
      await db.collection("private").doc(ref.id).set(pv);
    }
    closeModal(); toast("Saved");
  } catch(e){ $("#ferr").textContent = writeErr(e); }
}

function writeErr(e){

function offGroups(d, sf){
  const oc = offCount(d), byName = n => sf.rows.find(r => r.name === n) || person(n) || {};
  const sub = n => { const r = byName(n); return esc([r.rank, r.unit || r.station].filter(Boolean).join(" · ")); };
  const item = (n, tag, c) => `<div class="li"><div><div class="t">${esc(n)}</div><div class="d">${sub(n)}</div></div>${pill(tag, c)}</div>`;
  const grp = (title, count, body) => `<div class="fhead" style="margin-top:4px;display:flex;justify-content:space-between"><span>${title}</span><span class="hint">${count}</span></div><div class="list">${body}</div>`;
  const csOff = sf.rows.filter(r => r.status === "City Shift Group off");
  const other = sf.rows.filter(r => (!r.on && r.status !== "City Shift Group off" && !oc.appr.concat(oc.extra).some(v => v.name === r.name)) || r.inbound || r.moved);
  const vac = oc.appr.filter(v => byName(v.name).name || true);
  let h = grp(`Vacation`, `${vac.length} of ${+S().maxOff || "–"}`, vac.length ? vac.map((v,i) => item(v.name, `Slot ${i+1}`, "ok")).join("") : empty("Nobody on vacation."));
  if (oc.extra.length) h += grp(`Also off · outside slots`, oc.extra.length, oc.extra.map(v => item(v.name, v.outsideSlots === "Yes" ? "Other district" : "Extra", "info")).join(""));
  h += grp(`Alternates · working`, oc.alt.length, oc.alt.length ? oc.alt.map((v,i) => item(v.name, `Alternate ${i+1}`, "warn")).join("") : empty("No alternates."));
  h += grp(`City Shift Group ${sf.kg ?? "–"} off`, csOff.length, csOff.length ? csOff.map(r => item(r.name, "City Shift Group", "")).join("") : empty(sf.kg ? "No members in this group." : "No City Shift Group off this day."));
  if (other.length) h += grp(`Other changes`, other.length, other.map(r => item(r.name, r.moved && r.on ? `Moved ${r.moved} → ${r.station}` : r.status, r.on ? "info" : "warn")).join(""));
  return h;
}

    <div class="list">${oc.appr.length + oc.extra.length + oc.flex.length + oc.other.length + oc.alt.length + oc.req.length ? [

      ...oc.flex.map(v => [v, pill("Off · City Shift Group flex","info")]),

  </div>`;
}

async function sendCancel(btn){
  const { v, d, multi } = modalCtx.cancel;
  const data = { vacId:v.id, name:v.name, date:d, scope: multi ? $("#c_scope").value : "all", start:v.start, end:v.end || v.start, type:v.type || "Vacation", note:$("#c_note").value.trim(), by:me.email, byName:myName(), status:"Requested", added:Date.now() };
  btn.disabled = true;
  try { if (!db) throw 0; await db.collection("cancels").doc().set(data); closeModal(); toast("Cancel request sent"); }
  catch(e){ btn.disabled = false; $("#cerr").textContent = e && e.code === "invalid_argument" ? "The request couldn't be sent. Make sure you're signed in with the email on your roster entry." : writeErr(e); }
}
async function decideCancel(id, s, btn){
  const c = state.cancels.find(x => x.id === id); if (!c) return;
  btn.disabled = true;
  try {
    if (!db) throw 0;
    if (s === "Approved"){
      const covers = x => x.start <= c.date && (x.end || x.start) >= c.date;
      let v = state.vacations.find(x => x.id === c.vacId);
      if (c.scope !== "all" && v && !covers(v)) v = state.vacations.find(x => x.name === c.name && x.status === "Approved" && covers(x));
      if (v && v.status === "Approved"){
        const st = v.start, en = v.end || v.start, d = c.date, ref = db.collection("vacations").doc(v.id);
        if (c.scope === "all" || st === en) await ref.update({ status:"Cancelled" });
        else if (d === st) await ref.update({ start:addDays(d, 1) });
        else if (d === en) await ref.update({ end:addDays(d, -1) });
        else if (d > st && d < en){ const { id:_, ...rest } = v; await ref.update({ end:addDays(d, -1) }); await db.collection("vacations").doc().set({ ...rest, start:addDays(d, 1), end:en }); }
      }
    }
    await db.collection("cancels").doc(id).update({ status:s, decidedBy:me.email, decided:today() });
    toast(s === "Approved" ? "Leave cancelled" : "Cancel request denied");
  } catch(e){ btn.disabled = false; toast(writeErr(e)); }
}

function vTraining(){
  const t = today(), yr = t.slice(0,4);
  const done = state.training.filter(x => x.status === "Completed" && (x.date||"").startsWith(yr));
  const hrs = done.reduce((a,x)=>a+(+x.hours||0),0);
  const byCat = {}; done.forEach(x => byCat[x.category||"Other"] = (byCat[x.category||"Other"]||0) + (+x.hours||0));

  if (trainFilter === "Upcoming") list = list.filter(x => x.date >= t && x.status !== "Cancelled").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  else if (trainFilter === "Past") list = list.filter(x => x.date < t).sort((a,b)=>b.date.localeCompare(a.date));

  const maxCat = Math.max(1, ...Object.values(byCat));
  return `${banners()}

/* status of a dated requirement that repeats every `months` */
function reqStat(v, months){
  if (!v) return { k:"none", html:`${pill("None on file","warn")}` };
  if (!isDate(v)) return { k:"nodate", html:`${pill("Done · no date","")}` };
  const due = addMonths(v, months), t = today();
  if (due < t) return { k:"over", due, html:`<span>${fmtShort(v)} ’${v.slice(2,4)}</span>${pill("Overdue since "+fmtShort(due),"crit")}` };
  if (dnum(due) - dnum(t) <= 30) return { k:"soon", due, html:`<span>${fmtShort(v)} ’${v.slice(2,4)}</span>${pill("Due "+fmtShort(due),"warn")}` };
  return { k:"ok", due, html:`<span>${fmtShort(v)} ’${v.slice(2,4)}</span>${pill("Current","ok")}` };
}
const qNow = () => Math.floor((Number(today().slice(5,7))-1)/3);
function trainStat(p){
  if (p.q1 === undefined && p.q2 === undefined && p.q3 === undefined && p.q4 === undefined) return null;
  const need = +p.qNeed || 48, q = [p.q1,p.q2,p.q3,p.q4].map(x => +x || 0), yr = q.reduce((a,b)=>a+b,0);
  const qi = qNow(), thisQ = q[qi], pace = need * qi;
  const behind = q.slice(0,qi).reduce((a,b)=>a+b,0) < pace;
  return { need, q, yr, req: need*4, qi, thisQ, behind };
}
function physStat(p){

}

const MAP_FIELDS = [["","(keep as extra info)"],["skip","(don't import)"],["name","Full name"],["first","First name"],["last","Last name"],["rank","Rank"],["shift","Shift"],["station","Station"],["unit","Unit"],["position","Riding position"],["csGroup","City Shift Group #"],["roic","ROIC #"],["hireDate","Hire date"],["licensure","Medical licensure"],["empId","Employee #"],["phone","Phone"],["email","Email"],["certs","Certifications"],["notes","Notes"]];

function readWorkbook(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { imp.wb = XLSX.read(new Uint8Array(r.result), { type:"array", cellDates:true }); loadSheet(imp.wb.SheetNames[0]); } catch(e){ $("#ierr").textContent = "That file couldn't be read as a spreadsheet."; } };

function loadSheet(name){
  const ws = imp.wb.Sheets[name];
  const rows = XLSX.utils.sheet_to_json(ws, { defval:"", raw:false, dateNF:"yyyy-mm-dd" });
  imp.rows = rows.filter(r => Object.values(r).some(v => String(v).trim() !== ""));
  imp.headers = rows.length ? Object.keys(rows[0]).filter(h => !/^__EMPTY/.test(h) || imp.rows.some(r => r[h] !== "")) : [];
  imp.map = {}; const used = new Set();
  imp.headers.forEach(h => { const l = h.toLowerCase().trim(); const g = GUESS.find(([k,re]) => !used.has(k) && re.test(l)); if (g){ imp.map[h] = g[0]; used.add(g[0]); } else imp.map[h] = ""; });

    <div class="tw"><table><thead><tr><th>Your column</th><th>Goes to</th><th>First value</th></tr></thead><tbody>
    ${imp.headers.map((h,i)=>`<tr><td><b>${esc(h)}</b></td><td><select id="map_${i}" aria-label="Field for ${esc(h)}">${MAP_FIELDS.map(([k,l])=>`<option value="${k}"${imp.map[h]===k?" selected":""}>${esc(l)}</option>`).join("")}</select></td><td class="hint">${esc(String((imp.rows[0]||{})[h]??"").slice(0,40))}</td></tr>`).join("")}
    </tbody></table></div>`;
  $("#impGo").disabled = !imp.rows.length;

function normShift(v){ const s = String(v).trim(); if (!s) return ""; const sh = shifts(); const hit = sh.find(x => x.toLowerCase() === s.toLowerCase()); if (hit) return hit; const m = s.match(/\b([A-Za-z0-9])\b/g) || []; for (const t of m){ const h = sh.find(x => x.toLowerCase() === t.toLowerCase()); if (h) return h; } return s; }
function normStation(v){ const s = String(v).trim(); if (!s) return ""; const st = stationNames(); const hit = st.find(x => x.toLowerCase() === s.toLowerCase()); if (hit) return hit; const num = (s.match(/\d+/)||[])[0]; if (num){ const h = st.find(x => (x.match(/\d+/)||[])[0] === num); if (h) return h; } return s; }
async function runImport(btn){
  imp.headers.forEach((h,i) => imp.map[h] = $("#map_"+i).value);
  const vals = Object.values(imp.map);
  if (!vals.includes("name") && !(vals.includes("first") || vals.includes("last"))){ $("#ierr").textContent = "Match at least one column to Full name, or to First and Last name."; return; }
  if (!db){ $("#ierr").textContent = writeErr(); return; }
  btn.disabled = true;
  let n = 0, upd = 0, skipped = 0;
  for (const row of imp.rows){
    const rec = { extra:{} }; let first = "", last = "";
    for (const h of imp.headers){
      const f = imp.map[h], v = String(row[h] ?? "").trim();
      if (f === "skip") continue;
      if (f === "first") first = v; else if (f === "last") last = v;
      else if (f) rec[f] = v; else if (v !== "") rec.extra[h] = v;
    }
    if (!rec.name) rec.name = [first, last].filter(Boolean).join(" ");
    if (!rec.name){ skipped++; continue; }
    if (rec.shift) rec.shift = normShift(rec.shift);
    if (rec.station) rec.station = normStation(rec.station);
    if (!Object.keys(rec.extra).length) delete rec.extra;
    const ex = state.personnel.find(p => (p.name||"").toLowerCase() === rec.name.toLowerCase());
    try {
      if (ex){ const merged = { ...ex, ...rec, extra:{ ...(ex.extra||{}), ...(rec.extra||{}) } }; delete merged.id; delete merged.sample; if (!Object.keys(merged.extra).length) delete merged.extra; await db.collection("personnel").doc(ex.id).set(merged); upd++; }
      else { await db.collection("personnel").doc().set(rec); n++; }
    } catch(e){ $("#ierr").textContent = writeErr(e) + ` (${n+upd} saved before the error)`; btn.disabled = false; return; }
    btn.textContent = `Importing… ${n+upd} of ${imp.rows.length}`;
  }
  closeModal();
  toast(`Imported ${n} new, updated ${upd}${skipped?`, skipped ${skipped} rows with no name`:""}`);
}

(() => {
  let st = null; // {el, name, from, x, y, timer, drag, ghost, pid, touch}

  const clearHi = () => document.querySelectorAll(".st.dropok").forEach(e => e.classList.remove("dropok"));
  const begin = () => {
    if (!st) return; st.drag = true;
    st.ghost = st.el.cloneNode(true); st.ghost.classList.add("ghost"); st.ghost.style.left = st.x+"px"; st.ghost.style.top = st.y+"px";
    document.body.appendChild(st.ghost); st.el.classList.add("lifted");
    if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
  };
  const end = () => { if (!st) return; clearTimeout(st.timer); if (st.ghost) st.ghost.remove(); if (st.el) st.el.classList.remove("lifted"); clearHi(); st = null; };
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest(".mem[data-drag]"); if (!el || e.button > 0) return;
    st = { el, name: el.dataset.drag, from: el.dataset.from, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, drag:false, touch: e.pointerType !== "mouse" };
    if (st.touch) st.timer = setTimeout(begin, 350);
  });
  document.addEventListener("pointermove", e => {
    if (!st) return; st.x = e.clientX; st.y = e.clientY;
    const moved = Math.hypot(st.x - st.sx, st.y - st.sy) > 8;
    if (!st.drag){ if (moved){ if (st.touch){ end(); return; } begin(); } else return; }
    st.ghost.style.left = st.x+"px"; st.ghost.style.top = st.y+"px";
    clearHi(); const t = target(st.x, st.y); if (t && t.dataset.drop !== st.from) t.classList.add("dropok");
  });
  document.addEventListener("touchmove", e => { if (st && st.drag) e.preventDefault(); }, { passive:false });
  document.addEventListener("pointerup", e => {
    if (!st) return;
    const s = st;
    if (s.drag){ const t = target(e.clientX, e.clientY); end(); if (t && t.dataset.drop !== s.from) moveMember(s.name, t.dataset.drop, staffDate); }
    else { end(); pickCompany(s.name, s.from); }
  });

  document.addEventListener("contextmenu", e => { if (e.target.closest(".mem[data-drag]")) e.preventDefault(); });

let FB = null;

const fsErr = err => ({ code: err && err.code === "permission-denied" ? "invalid_argument" : err && err.code === "resource-exhausted" ? "quota_exceeded" : "unavailable", message: err && err.message });
const guard = p => p.catch(err => { throw fsErr(err); });
function snapDoc(sn){ return { id:sn.id, exists:sn.exists(), data:() => sn.data(), metadata:sn.metadata }; }
function wrapDoc(ref){
  const F = FB.fs;
  return { id:ref.id, path:ref.path,
    get: async () => snapDoc(await F.getDoc(ref)),
    set: d => guard(F.setDoc(ref, clean(d))), update: d => guard(F.updateDoc(ref, clean(d))), delete: () => guard(F.deleteDoc(ref)),
    onSnapshot: (n, e) => F.onSnapshot(ref, sn => n(snapDoc(sn)), err => e && e(fsErr(err))) };
}
function wrapColl(path){
  const F = FB.fs, cref = F.collection(FB.db, path);
  return { path,
    doc: id => wrapDoc(id ? F.doc(cref, id) : F.doc(cref)),
    onSnapshot: (n, e) => F.onSnapshot(cref, sn => n({ docs: sn.docs.map(d => ({ id:d.id, data:() => d.data() })), metadata: sn.metadata }), err => e && e(fsErr(err))) };
}
function lockedView(html){ document.body.classList.add("locked"); $("#who").innerHTML = ""; $("#main").innerHTML = `<section class="panel login">${html}</section>`; }
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const authMsg = x => ({ "auth/invalid-credential":"That email and password don't match. Try again, or use Forgot password.", "auth/wrong-password":"That email and password don't match.", "auth/user-not-found":"No account for that email yet. Use Create your password.", "auth/email-already-in-use":"That email already has a password. Sign in, or use Forgot password.", "auth/weak-password":"Use at least 8 characters for your password.", "auth/invalid-email":"That email address isn't valid.", "auth/too-many-requests":"Too many tries. Wait a few minutes and try again.", "auth/network-request-failed":"No connection. Check your signal and try again." }[x && x.code] || ("Something went wrong: " + (x && (x.code || x.message))));
function showLogin(mode){
  mode = mode || "signin";
  const em = esc(lsGet("tfdLastEmail") || "");
  const title = { signin:"Sign in", create:"Create your password", reset:"Reset your password" }[mode];
  const hint = { signin:"Use the email the district chief added for you.", create:"First time here? Use the email the district chief added for you and pick a password of at least 8 characters. We'll email you a link to confirm the address.", reset:"Enter your email and we'll send a link to set a new password." }[mode];
  lockedView(`<h2>${title}</h2><div class="hint">${hint}</div>
    <form id="lgForm" class="form" style="grid-template-columns:1fr" novalidate>
      <label for="lg_e">Email<input id="lg_e" type="email" autocomplete="username" value="${em}"></label>
      ${mode !== "reset" ? `<label for="lg_p">Password<input id="lg_p" type="password" autocomplete="${mode==="create"?"new-password":"current-password"}"></label>` : ""}
      ${mode === "create" ? `<label for="lg_p2">Password again<input id="lg_p2" type="password" autocomplete="new-password"></label>` : ""}
    </form>
    <div class="err" id="lgErr"></div>
    <button class="btn pri" id="lg_go">${{ signin:"Sign in", create:"Create password", reset:"Send reset link" }[mode]}</button>
    <div class="tools">${mode !== "signin" ? `<button class="linkbtn" data-lg="signin">Back to sign in</button>` : `<button class="linkbtn" data-lg="create">First time? Create your password</button><button class="linkbtn" data-lg="reset">Forgot password</button>`}</div>`);
  document.querySelectorAll("[data-lg]").forEach(b => b.onclick = () => showLogin(b.dataset.lg));
  const go = async () => {
    const email = $("#lg_e").value.trim().toLowerCase(), pw = $("#lg_p") ? $("#lg_p").value : "";
    if (!EMAIL_RE.test(email)){ $("#lgErr").textContent = "Enter your full email address."; return; }
    if (mode === "create" && pw.length < 8){ $("#lgErr").textContent = "Use at least 8 characters for your password."; return; }
    if (mode === "create" && pw !== $("#lg_p2").value){ $("#lgErr").textContent = "The two passwords don't match."; return; }
    if (mode === "signin" && !pw){ $("#lgErr").textContent = "Enter your password."; return; }
    lsSet("tfdLastEmail", email); $("#lg_go").disabled = true;
    try {
      if (mode === "signin") await FB.A.signInWithEmailAndPassword(FB.auth, email, pw);
      else if (mode === "create"){ const c = await FB.A.createUserWithEmailAndPassword(FB.auth, email, pw); await FB.A.sendEmailVerification(c.user); }
      else { await FB.A.sendPasswordResetEmail(FB.auth, email); lockedView(`<h2>Check your email</h2><div class="hint">If <b>${esc(email)}</b> has an account, a link to set a new password is on its way. Check your junk folder too.</div><button class="btn pri" onclick="location.reload()">Back to sign in</button>`); }
    } catch(x){ $("#lg_go").disabled = false; $("#lgErr").textContent = authMsg(x); }
  };
  $("#lg_go").onclick = go;
  $("#lgForm").onsubmit = e => { e.preventDefault(); go(); };
  $("#lgForm").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); go(); } });
}
function showVerify(u){
  lockedView(`<h2>Confirm your email</h2><div class="hint">We sent a confirmation link to <b>${esc(u.email)}</b>. Open it, then come back and tap <b>I've confirmed</b>. Check your junk folder if you don't see it.</div><div class="err" id="vErr"></div>
    <div class="tools"><button class="btn pri" id="v_ok">I've confirmed</button><button class="btn" id="v_again">Send it again</button><button class="btn" data-a="signout">Sign out</button></div>`);
  $("#v_ok").onclick = async () => { await u.reload(); if (FB.auth.currentUser.emailVerified){ await FB.auth.currentUser.getIdToken(true); started = false; startSession(FB.auth.currentUser); } else $("#vErr").textContent = "Not confirmed yet. Open the link in the email first."; };
  $("#v_again").onclick = async () => { try { await FB.A.sendEmailVerification(u); $("#vErr").textContent = "Sent. Check your email."; } catch(x){ $("#vErr").textContent = authMsg(x); } };
}
let started = false;
async function startSession(u){
  if (started) return;
  if (!u.emailVerified){ showVerify(u); return; }
  started = true;
  const email = (u.email || "").toLowerCase();
  let acc = null;
  try { const sn = await FB.fs.getDoc(FB.fs.doc(FB.db, "access", email)); acc = sn.exists() ? sn.data() : null; } catch(e){ acc = null; }
  if (!acc){ lockedView(`<h2>Not on the access list</h2><div class="hint">You're signed in as <b>${esc(email)}</b>, but this address hasn't been given access. Ask the district chief to add it, then reload this page.</div><button class="btn" data-a="signout">Sign out</button>`); return; }
  me = { email, role: acc.role || "viewer" };
  canWrite = me.role === "editor" || me.role === "admin"; isAdmin = me.role === "admin";
  document.body.classList.toggle("ro", !canWrite);
  document.body.classList.remove("locked");
  $("#who").innerHTML = `${esc(acc.name || email)} · ${esc(ROLE_LABEL[me.role] || me.role)}<button data-a="signout">Sign out</button>`;
  db = { collection: wrapColl, doc: path => wrapDoc(FB.fs.doc(FB.db, path)) };
  route();
  const timer = setTimeout(() => { loadNote = "The district data can't be reached yet. Check your connection; this page will fill in when it connects."; render(); }, 10000);
  const done = k => { loaded.add(k); if (loaded.size >= COLLS.length + 1){ clearTimeout(timer); loadNote = ""; } };
  let pending = false; const later = () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); };
  const fail = k => e => { done(k); loadNote = "Some data couldn't be loaded. Reload the page; if it keeps happening, ask the district chief to check your access."; later(); };
  let firstSet = true;
  db.doc("config/settings").onSnapshot(s => { state.settings = s.exists ? s.data() : null; if (firstSet && s.exists){ firstSet = false; staffDate = homeDate(); vacSel = homeDate(); } if (!s.metadata.fromCache) done("settings"); later(); }, fail("settings"));
  db.doc("config/vacbook").onSnapshot(s => { state.vacbook = s.exists ? s.data() : null; later(); }, () => {});
  COLLS.forEach(c => db.collection(c).onSnapshot(s => { state[c] = s.docs.map(d => ({ id:d.id, ...d.data() })); if (!s.metadata.fromCache) done(c); later(); }, fail(c)));
  if (isAdmin){
    db.collection("access").onSnapshot(s => { state.access = s.docs.map(d => ({ id:d.id, ...d.data() })); later(); }, () => {});
  }
}
(async () => {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)){ lockedView(`<h2>Almost ready</h2><div class="hint">This app isn't connected to its database yet. Open <b>config.js</b> and paste in the Firebase settings, as described in SETUP.md.</div>`); return; }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const app = appM.initializeApp(cfg);
    FB = { app, A: authM, fs: fsM, auth: authM.getAuth(app), db: fsM.getFirestore(app) };
  } catch(e){ lockedView(`<h2>Can't connect</h2><div class="hint">The sign-in service didn't load. Check your connection and reload the page.</div>`); return; }
  FB.A.onAuthStateChanged(FB.auth, u => { if (u) startSession(u); else showLogin("signin"); });
})();
</script>
